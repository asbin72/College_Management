name: Continuous Integration & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-integration:
    name: Unit & Integration API Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kalpanaa_education_db_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Initialize Test Database Schema & Seeds
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_PORT: 3306
          DB_NAME: kalpanaa_education_db_test
          JWT_SECRET: replace_with_a_secure_random_jwt_secret_in_production
        run: |
          node -e "import('./server/init_db.js').then(m => m.initializeDatabase('kalpanaa_education_db_test'))"

      - name: Run Unit Tests (Pure Logic)
        run: npm run test:unit

      - name: Start Backend Server in Background
        env:
          NODE_ENV: test
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_PORT: 3306
          DB_NAME: kalpanaa_education_db_test
          JWT_SECRET: replace_with_a_secure_random_jwt_secret_in_production
        run: |
          node server/index.js &
          sleep 4
          curl -f http://127.0.0.1:5000/api/health || exit 1

      - name: Run Integration & RBAC Tests
        env:
          TEST_API_URL: http://127.0.0.1:5000
          JWT_SECRET: replace_with_a_secure_random_jwt_secret_in_production
        run: npm run test:integration

      - name: Run Concurrency Load Verification
        env:
          TEST_API_URL: http://127.0.0.1:5000/api
          JWT_SECRET: replace_with_a_secure_random_jwt_secret_in_production
        run: npm run test:load

  e2e-nightly:
    name: E2E Playwright Browser Tests (Nightly / Scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
